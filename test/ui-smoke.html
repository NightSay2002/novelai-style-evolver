<!doctype html>
<html lang="zh-Hant">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UI smoke test · no API calls</title>
<style>
  body { margin: 0; background: #17171d; color: #e9e5f3; font: 13px system-ui; }
  header { padding: 12px 18px; } button { margin-left: 12px; padding: 7px 12px; }
  #results { margin: 0 18px 14px; max-height: 220px; overflow: auto; line-height: 1.8; white-space: pre-wrap; }
  iframe { width: 100%; height: 800px; border: 0; background: #101114; }
</style>
<header>隔離 UI 測試：記憶體資料、獨立測試資料庫、不呼叫 NovelAI。<button id="run" disabled>執行測試</button></header>
<pre id="results">準備中…</pre>
<iframe title="隔離測試畫面"></iframe>
<script type="module">
  const frame = document.querySelector('iframe');
  const results = document.querySelector('#results');
  const root = new URL('../', location.href).href;
  const { parseStylePrompt } = await import(new URL('src/evolution.js', root));
  const appSource = await (await fetch(new URL('app.js', root))).text();
  const pageSource = await (await fetch(new URL('index.html', root))).text();
  const moduleUrl = (text) => URL.createObjectURL(new Blob([text], { type: 'text/javascript' }));
  const memoryModule = moduleUrl(`
    const clone = (value) => structuredClone(value);
    export const FAVORITE_LIMIT = 50;
    export const getState = async (key, fallback) => clone((key === 'active' ? window.uiTest.state : window.uiTest.otherStates.get(key)) ?? fallback);
    export const setState = async (key, value) => {
      if (window.uiTest.saveDelay) await new Promise(resolve => setTimeout(resolve, window.uiTest.saveDelay));
      if (key === 'active' && window.uiTest.failVote && value.batchNumber > window.uiTest.state.batchNumber) throw new Error('模擬偏好保存失敗');
      if (key === 'active') window.uiTest.state = clone(value);
      else window.uiTest.otherStates.set(key, clone(value));
    };
    export const saveBatchSavePoint = async (point, active) => {
      if (window.uiTest.failCheckpoint) throw new Error('模擬儲存點磁碟配額不足');
      await setState('active', active);
      window.uiTest.savepoints.set(point.id, clone(point));
      prune();
    };
    export const getSavePoint = async id => clone(window.uiTest.savepoints.get(id) ?? null);
    export const restoreExplorationState = async (active, image, tools) => {
      if (window.uiTest.failRestore) throw new Error('模擬儲存點還原交易失敗');
      window.uiTest.restoreCalls = (window.uiTest.restoreCalls || 0) + 1;
      window.uiTest.state = clone(active);
      window.uiTest.otherStates.set('image2image', clone(image));
      window.uiTest.otherStates.set('referenceTools', clone(tools));
      prune();
    };
    const prune = () => {
      const records = [...window.uiTest.images.values(), ...window.uiTest.favorites.values(), ...(window.uiTest.state?.currentBatch || []), ...(window.uiTest.state?.baseline ? [window.uiTest.state.baseline] : [])];
      const keep = new Set(records.map(item => item.savePointId));
      for (const id of window.uiTest.savepoints.keys()) if (!keep.has(id)) window.uiTest.savepoints.delete(id);
    };
    export const trimImages = async () => {
      const records = [...window.uiTest.images.values()].sort((a, b) => b.createdAt.localeCompare(a.createdAt));
      for (const item of records.slice(50)) window.uiTest.images.delete(item.id);
      prune();
      return Math.max(0, records.length - 50);
    };
    export const getImages = async () => [...window.uiTest.images.values()].map(clone);
    export const getImagesByBatch = async (batch) => (await getImages()).filter(x => x.batchId === batch);
    export const saveImage = async (value) => {
      window.uiTest.images.set(value.id, clone(value));
      window.uiTest.generationTimings.at(-1).savedAt = performance.now();
      await trimImages();
    };
    export const getFavorites = async () => [...window.uiTest.favorites.values()].map(clone);
    export const saveFavorite = async (value) => {
      if (!window.uiTest.favorites.has(value.id) && window.uiTest.favorites.size >= 50) throw new Error('收藏已達 50 張，請先取消其他收藏。');
      window.uiTest.favorites.set(value.id, clone(value));
    };
    export const deleteFavorite = async (id) => { window.uiTest.favorites.delete(id); prune(); };
    export const clearExplorationData = async () => { window.uiTest.state = null; window.uiTest.images.clear(); prune(); };
  `);
  const naiModule = moduleUrl(`
    export { availableNoiseSchedules, availableSamplers, buildNovelAiPayload, DEFAULT_GENERATION_SETTINGS, estimateNovelAiCost, FIXED_SETTINGS, modelCapabilities, MODELS, NOISE_SCHEDULES, normalizeGenerationSettings, normalizeImageDimensions, SAMPLERS } from '${root}src/nai.js?v=10';
    export async function fetchNovelAiAnlas({ token }) {
      window.uiTest.balanceRequests ??= [];
      window.uiTest.balanceRequests.push(token);
      if (window.uiTest.deferBalance) return new Promise(resolve => { window.uiTest.resolveBalance = resolve; });
      if (window.uiTest.balanceError) throw new Error('模擬餘額查詢失敗');
      return window.uiTest.balance ?? { total: 166125, subscription: 10000, purchased: 156125, account: { isOpus: true, opusUsageExhausted: false } };
    }
    export async function encodeNovelAiVibe(settings) {
      window.uiTest.encodings ??= [];
      window.uiTest.encodings.push(structuredClone(settings));
      return 'dGVzdC12aWJl';
    }
    export async function generateNovelAiImage({ signal, prompt, negativePrompt, image2Image, generationSettings, references }) {
      window.uiTest.requests.push(structuredClone({ prompt, negativePrompt, image2Image, generationSettings, references }));
      window.uiTest.generationTimings.push({ startedAt: performance.now() });
      return new Promise((resolve, reject) => {
        const stop = () => { window.uiTest.pending = null; reject(new Error('已停止生成。')); };
        if (signal.aborted) return stop();
        signal.addEventListener('abort', stop, { once: true });
        window.uiTest.pending = (fail = false) => {
          signal.removeEventListener('abort', stop);
          window.uiTest.pending = null;
          if (fail) reject(new Error('NovelAI 503: 模擬失敗'));
          else resolve({ name: 'test.png', blob: window.uiTest.image });
        };
      });
    }
  `);
  const patchedApp = moduleUrl(appSource.replaceAll('"./src/', '"' + root + 'src/')
    .replace('"' + root + 'src/storage.js?v=7"', JSON.stringify(memoryModule))
    .replace('"' + root + 'src/nai.js?v=10"', JSON.stringify(naiModule)));
  const bootstrap = moduleUrl(`
    const png = Uint8Array.from(atob('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAwMCAO+aN1cAAAAASUVORK5CYII='), c => c.charCodeAt(0));
    window.uiTest = window.parent.uiTestSession ??= { state: null, otherStates: new Map(), savepoints: new Map(), local: new Map(), session: new Map(), images: new Map(), favorites: new Map(), requests: [], generationTimings: [], pending: null, image: new Blob([png], {type:'image/png'}), downloads: [] };
    if (!window.uiTest.largeImageReady) {
      const sample = document.createElement('canvas');
      sample.width = 832; sample.height = 1216;
      const context = sample.getContext('2d');
      const gradient = context.createLinearGradient(0, 0, 832, 1216);
      gradient.addColorStop(0, '#f4b8c9'); gradient.addColorStop(1, '#2d165a');
      context.fillStyle = gradient; context.fillRect(0, 0, 832, 1216);
      window.uiTest.image = await new Promise(resolve => sample.toBlob(resolve, 'image/png'));
      window.uiTest.largeImageReady = true;
    }
    const nativeBitmap = window.createImageBitmap.bind(window);
    window.createImageBitmap = (...args) => {
      window.uiTest.decodeCalls = (window.uiTest.decodeCalls || 0) + 1;
      return nativeBitmap(...args);
    };
    const nativeTimeout = window.setTimeout.bind(window);
    window.setTimeout = (callback, delay, ...args) => nativeTimeout(callback, window.uiTest.fastImageDelays && callback.name === 'finish' && delay >= 500 && delay <= 1500 ? 10 : delay, ...args);
    const memoryStorage = (data) => {
      return { getItem: k => data.get(k) ?? null, setItem: (k,v) => data.set(k, String(v)), removeItem: k => data.delete(k) };
    };
    Object.defineProperty(window, 'localStorage', { value: memoryStorage(window.uiTest.local) });
    Object.defineProperty(window, 'sessionStorage', { value: memoryStorage(window.uiTest.session) });
    const nativeFetch = window.fetch.bind(window);
    window.fetch = (url, options) => {
      if (new URL(url, document.baseURI).origin !== new URL(document.baseURI).origin) throw new Error('UI test blocks external requests');
      return nativeFetch(url, options);
    };
    HTMLAnchorElement.prototype.click = function () { window.uiTest.downloads.push(this.download); };
    window.confirm = () => true;
    sessionStorage.setItem('novelai_style_evolver_token_session', 'ui-test-not-a-real-token');
    await import('${patchedApp}');
  `);
  frame.srcdoc = pageSource.replace('<head>', '<head><base href="' + root + '">')
    .replace(/\.\/app\.js\?v=\d+/, bootstrap);
  const pause = (ms) => new Promise(resolve => setTimeout(resolve, ms));
  async function until(predicate, label) {
    const deadline = Date.now() + 8000;
    while (!predicate()) {
      if (Date.now() > deadline) throw new Error('Timeout: ' + label);
      await pause(20);
    }
  }
  function assert(condition, label) {
    if (!condition) throw new Error(label);
    results.textContent += 'PASS ' + label + '\n';
  }
  function elementRatio(element) {
    const style = element.ownerDocument.defaultView.getComputedStyle(element);
    return parseFloat(style.width) / parseFloat(style.height);
  }
  function cardsHaveRatio(doc, width, height) {
    const visuals = [...doc.querySelectorAll('.card-visual')];
    return visuals.length === 5 && visuals.every(element => Math.abs(elementRatio(element) - width / height) < 0.01);
  }
  await until(() => frame.contentDocument.querySelector('#generateButton')?.disabled === false, 'initialized');
  results.textContent = '已準備，可執行。';
  document.querySelector('#run').disabled = false;
  document.querySelector('#run').addEventListener('click', async (event) => {
    event.target.disabled = true;
    results.textContent = '';
    const win = frame.contentWindow;
    const doc = frame.contentDocument;
    const data = win.uiTest;
    const $ = selector => doc.querySelector(selector);
    const click = selector => $(selector).click();
    const change = (selector, value) => { if (typeof value === 'boolean') $(selector).checked = value; else $(selector).value = value; $(selector).dispatchEvent(new win.Event('input', { bubbles: true })); };
    const answer = async (fail = false) => { await until(() => data.pending, 'pending image'); data.pending(fail); };
    try {
      assert($('#contentPrompt').value === 'girl,closed mouth,purplehair,straight_hair,, medium_hair, pink eyes,hair_between_eyes ,flat_chest,\ncowboy_shot', '首次開啟使用作者內容模板，保留原文');
      assert($('#negativePrompt').value.startsWith('{horizontal_pupils},{slit_pupils}') && $('#negativePrompt').value.endsWith('{{{simple background}}}'), '首次開啟使用作者 Negative Prompt');
      assert($('.author-badge').getAttribute('href') === 'https://github.com/NightSay2002' && $('.author-badge').textContent === '作者：時分' && $('.author-badge use').getAttribute('href') === '#i-star', '作者連結與黄色星星替代本機工作室');
      assert(win.getComputedStyle($('.author-badge svg')).animationName === 'author-star-spin' && win.getComputedStyle($('.author-badge svg')).animationIterationCount === 'infinite', '作者星星持續旋轉');
      click('[data-panel="style"]');
      assert($('label[for="seedStylePrompt"]').textContent === '質量詞' && $('#applySeedButton').textContent === '套用', '質量詞欄位及套用按鈕使用新名稱');
      assert($('#styleDatabase').hidden, '關閉並隱藏風格抽取介面');
      const fixedQuality = parseStylePrompt($('#seedStylePrompt').value);
      click('#controlsDrawer [data-close-drawer]');
      click('#customStartButton');
      assert($('#controlsDrawer').open && !$('[data-panel-body="start"]').hidden && $('#artistThreshold').min === '50' && !$('#artistThreshold').hasAttribute('max'), '目前最佳旁可開啟畫師起點，門檻最低 50 且無上限');
      $('#artistThreshold').value = '100';
      $('#artistThreshold').dispatchEvent(new win.Event('change', { bubbles: true }));
      assert($('#artistThresholdStatus').textContent.includes('目前門檻 100') && JSON.parse(data.local.get('novelai_style_evolver_settings')).artistPostCount === 100, '自訂作品數門檻即時篩選並保存在瀏覽器');
      change('#startingArtists', '99::artist:Mashiro_Shiki::, -9::artist:dhfddf::, procrastinator39');
      click('#applyStartingArtistsButton');
      await until(() => data.state?.customArtists?.length === 3 && !$('#controlsDrawer').open, 'custom start applied');
      const normalizedArtistStart = $('#startingArtists').value;
      const startingArtistSnapshot = JSON.stringify(data.state.parents[0].artists);
      assert(data.state.parents[0].artists.map(item => item.tag).join(',') === 'artist:mashiro_shiki,artist:dhfddf,artist:procrastinator39'
        && data.state.parents[0].artists.every(item => item.weight >= 0.1 && item.weight <= 2)
        && data.state.learning.models.every(model => data.state.parents[0].artists.every(item => model['a:' + item.tag] === 0.1)), '自選起點忽略輸入權重、正規化 artist: 標籤、接受未知畫師並給初始偏好 +1');
      assert(normalizedArtistStart.includes('artist:mashiro_shiki') && normalizedArtistStart.includes('artist:dhfddf')
        && !normalizedArtistStart.includes('99::') && !normalizedArtistStart.includes('-9::'), '套用後欄位改寫成實際隨機權重的正規畫師 Prompt');
      assert($('#baselineHint').textContent.includes('自選起點') && $('#customStartButton').textContent === '更換畫師起點', '卡桌顯示自選起點摘要及更換入口');
      click('#resetButton');
      await until(() => data.state && data.state.customArtists?.length === 3 && !data.state.currentBatch.length, 'custom start reset');
      assert(JSON.stringify(data.state.parents[0].artists) === startingArtistSnapshot && $('#startingArtists').value === normalizedArtistStart
        && data.state.learning.models.every(model => data.state.parents[0].artists.every(item => model['a:' + item.tag] === 0.1)), '重新開始探索保留自選起點、隨機權重與正規內容，偏好重新由 +1 開始');
      click('#customStartButton');
      $('#artistThreshold').value = '150';
      $('#artistThreshold').dispatchEvent(new win.Event('change', { bubbles: true }));
      click('#controlsDrawer [data-close-drawer]');
      click('[data-panel="style"]');
      click('#applySeedButton');
      await until(() => !data.state.customStart && !data.state.parents[0].artists.length, 'custom start cleared for remaining tests');
      await until(() => !$('#anlasButton').disabled && $('#anlasBalance').textContent === '166,125', 'initial Anlas balance');
      assert($('#anlasButton').closest('.header-left') && $('#anlasButton').title.includes('156,125'), 'Anlas 在左上角顯示真實合計與兩種餘額提示');
      assert(!$('.header-actions [data-panel="settings"]') && !$('#modelLabel') && $('.tool-rail [data-panel="settings"]'), '移除右上角重複設定入口，左側模型及生成設定仍可使用');
      assert($('#generationCost').textContent === '預估 0 Anlas', '已確認 Opus 與 V5 免費用量時顯示整批預估 0 Anlas');
      assert(!$('.vote-actions [data-generation-cost]') && !$('#generationCost').hidden && $('#nextBatchCost').hidden && !$('#generateButton').textContent.includes('Anlas'), '費用與提示移到按鈕外，只顯示目前操作的預估');
      const initialFrameWidth = frame.style.width;
      for (const width of [1280, 1000, 800, 760, 556, 390, 320]) {
        frame.style.width = width + 'px';
        await pause(30);
        const left = $('.header-left').getBoundingClientRect();
        const right = $('.header-actions').getBoundingClientRect();
        assert(left.right <= right.left && right.right <= doc.documentElement.clientWidth && $('#anlasButton').getBoundingClientRect().height < 40,
          width + 'px 頁首餘額不重疊音樂與模型按鈕、不增加高度');
        assert($('#generateButton').getBoundingClientRect().right <= doc.documentElement.clientWidth && $('#generationCost').getBoundingClientRect().right <= doc.documentElement.clientWidth,
          width + 'px 按鈕及外部費用不溢出螢幕');
      }
      frame.style.width = initialFrameWidth;
      assert(doc.querySelectorAll('.candidate').length === 5, '五張初始卡背');
      assert(cardsHaveRatio(doc, 832, 1216), '初始直牌圖片框使用 832 × 1216 比例');
      assert(!$('.candidate input[type="checkbox"]'), '卡片已移除小方格');
      assert($('.candidate [data-action="favorite"] use').getAttribute('href') === '#i-star' && $('[data-drawer-library="favorites"] use').getAttribute('href') === '#i-star', '卡片與側欄收藏都使用星星');
      assert($('.candidate [data-action="like"] use').getAttribute('href') === '#i-like', '獨立讚好按鈕使用正讚圖示');
      assert(!$('#batchHint') && $('#selectionSummary').hidden, '初始卡桌不顯示口號或資料載入數量');
      assert($('#ignoreBatchButton').hidden && $('#ignoreBatchButton').disabled, '未生成時隱藏並停用忽略本批');
      assert(!$('#image2ImageEnabled').checked && $('#image2ImageEnabled').disabled && $('#referencePreview').hidden, 'Image2Image 預設關閉，沒有參考圖不能啟用');
      click('[data-panel="content"]');
      assert($('#controlsDrawer').open && !$('[data-panel-body="content"]').hidden, '內容抽屜可開啟');
      change('#contentPrompt', 'solo, landscape');
      change('#negativePrompt', 'text');
      click('[data-panel="settings"]');
      change('#generationSteps', 29);
      assert($('#generationCost').textContent === '預估 150 Anlas' && $('#generationCost').title.includes('5 次單張'), 'Steps 超過免費條件立即更新外部費用及提示');
      change('#generationSteps', 28);
      const defaults = { width: 832, height: 1216, seed: 114514, sampler: 'k_euler_ancestral', steps: 28, guidance: 5.5, cfgRescale: 0.2, model: 'nai-diffusion-5-full', noiseSchedule: 'karras', varietyPlus: false, decrisp: false, smea: false, smeaDyn: false, autoSmea: false, legacyUc: false };
      const custom = { ...defaults, width: 1216, height: 832, seed: 20260912, sampler: 'k_euler', steps: 21, guidance: 7, cfgRescale: 0.35 };
      const settingSelector = key => '#generation' + key[0].toUpperCase() + key.slice(1);
      assert(Object.entries(defaults).every(([key, value]) => typeof value === 'boolean' ? $(settingSelector(key)).checked === value : $(settingSelector(key)).value === String(value)), '生成設定保留原預設值並提供可編輯欄位');
      assert(!$('[data-panel-body="settings"]').textContent.includes('Quality Tags') && !$('[data-panel-body="settings"]').textContent.includes('預設 UC'), '設定面板不顯示自動 Quality Tags 與預設 UC');
      for (const [key, value] of [['width', 800], ['seed', ''], ['steps', 51], ['cfgRescale', 1.01]]) {
        change(settingSelector(key), value);
        assert($('#generateButton').disabled && $('#generationSettingsStatus').classList.contains('is-error') && data.requests.length === 0, '無效 ' + key + ' 不會送出新批次');
        change(settingSelector(key), defaults[key]);
      }
      const initialCards = [...doc.querySelectorAll('.candidate')];
      change('#generationWidth', 1216);
      change('#generationHeight', 832);
      assert(cardsHaveRatio(doc, 1216, 832), '未抽牌時尺寸設定立即預覽橫牌卡背');
      change('#generationWidth', 1024);
      change('#generationHeight', 1024);
      assert(cardsHaveRatio(doc, 1024, 1024), '未抽牌時 1024 × 1024 預覽方牌卡背');
      assert(initialCards.every((card, index) => card === $('#candidateGrid').children[index]), '尺寸預覽沿用原卡片，不重播發牌動畫');
      change('#generationWidth', 832);
      change('#generationHeight', 1216);
      click('#controlsDrawer [data-close-drawer]');
      await until(() => !$('[data-panel="content"]').matches('[aria-expanded="true"]'), 'drawer closed');
      assert(!$('[data-panel="content"]').matches('[aria-expanded="true"]'), '關閉抽屜同步展開狀態');
      click('#generateButton');
      click('#generateButton');
      await until(() => data.pending, 'first request');
      const firstCard = $('.candidate');
      assert($('#resetButton').disabled && $('#applySeedButton').disabled, '生成中禁止重設與套用基因');
      assert($('#generationCost').hidden && $('#nextBatchCost').hidden, '生成中隱藏原按鈕時，外部費用同步隱藏');
      assert(!firstCard.classList.contains('is-revealed'), '圖片到達前保持卡背');
      await answer();
      await until(() => $('.candidate.is-revealed'), 'first reveal');
      assert($('.candidate') === firstCard && data.requests.length === 1 && !data.pending, '回圖即揭示、沿用卡片，等待期間不提前發下一張');
      assert(firstCard.querySelector('img').naturalWidth === 438 && firstCard.querySelector('img').naturalHeight === 640,
        '卡桌使用最長邊 640px 的等比例縮圖，不解碼原始 832 × 1216 圖片');
      const cardThumbnail = await (await win.fetch(firstCard.querySelector('img').src)).blob();
      assert(cardThumbnail.type === 'image/webp' && cardThumbnail.size < data.image.size, '卡桌縮圖經 WebP 壓縮，原始 PNG 不改寫');
      click('.candidate [data-action="select"]');
      assert(!firstCard.classList.contains('selected'), '生成中點框內不會選取');
      click('.candidate [data-action="like"]');
      assert($('.candidate [data-action="like"]').disabled && !firstCard.classList.contains('selected'), '生成中禁止讚好');
      click('.candidate [data-action="dislike"]');
      assert($('.candidate [data-action="dislike"]').disabled && !firstCard.classList.contains('is-disliked'), '生成中禁止標記不喜歡');
      click('#ignoreBatchButton');
      assert($('#ignoreBatchButton').disabled && data.state.votes.length === 0 && data.requests.length === 1, '生成中不能忽略或提前換批');
      change('#contentPrompt', 'next batch content');
      change('#seedStylePrompt', '-1.7::simple illustration::, 0.3::watercolor::, best quality');
      for (const [key, value] of Object.entries(custom)) change(settingSelector(key), value);
      assert(!$('#generationWidth').disabled && !$('#generationSampler').disabled, '生成中可修改下一批設定');
      assert(cardsHaveRatio(doc, 832, 1216), '進行中改橫向尺寸不改變本批直牌外觀');
      change('#generationWidth', 800);
      await until(() => data.requests.length === 2 && data.pending, 'second request after delay');
      const imageGap = data.generationTimings[1].startedAt - data.generationTimings[0].savedAt;
      assert(imageGap >= 490 && imageGap < 2000, '儲存完成後隨機等 0.5–1.5 秒，再送下一張（容許少量介面處理時間）');
      await answer();
      await until(() => data.images.size === 2 && !data.pending, 'waiting after second image');
      click('#stopButton');
      await until(() => !$('#generateButton').hidden, 'stopped');
      assert(data.images.size === 2 && data.requests.length === 2, '等待期間停止立即結束，保留已完成兩張、不發第三張');
      await pause(1600);
      assert(data.requests.length === 2 && !data.pending, '停止清除等待計時器，不會延遲補發請求');
      assert(!$('#generateButton').disabled && $('#generationSettingsStatus').classList.contains('is-error'), '下一批設定無效仍可繼續原批次');
      change('#generationWidth', custom.width);
      change('#generationSteps', 29);

        await secondStorage.clearExplorationData();
        assert(await secondStorage.getState('active') === null && (await secondStorage.getState('image2image')).fileName === 'savepoint-original.png', '真實 IndexedDB 重設探索只刪除進度，保留參考圖');
        assert((await secondStorage.getState('referenceTools')).precise.images[0].fileName === 'precise-one.png', '真實 IndexedDB 重設探索保留 Vibe 與 Precise 工具');
        assert(await secondStorage.getSavePoint('recent-checkpoint') === null && await secondStorage.getSavePoint(databasePoint.id), '重設清理歷史快照但保留收藏儲存點');
        await secondStorage.deleteFavorite(databaseImage.id);
        assert(await secondStorage.getSavePoint(databasePoint.id) === null && (await secondStorage.getFavorites()).length === 49, '取消已淘汰歷史的收藏後釋放其無引用快照');
      } finally {
        if (firstStorage) (await firstStorage.openDatabase()).close();
        if (secondStorage) (await secondStorage.openDatabase()).close();
        await new Promise((resolve, reject) => {
          const request = indexedDB.deleteDatabase(databaseName);
          request.onsuccess = resolve;
          request.onerror = () => reject(request.error);
        });
        URL.revokeObjectURL(firstStorageUrl);
        URL.revokeObjectURL(secondStorageUrl);
      }
      results.textContent += '\nALL PASSED — no real API or production browser data used.\n';
    } catch (error) {
      results.textContent += 'FAIL ' + error.message + '\n';
      console.error(error);
    }
  });
</script>
